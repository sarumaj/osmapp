# .github/workflows/renovate-vendor.yml
name: Renovate vendor sync
on:
  pull_request:
    branches: ["renovate/**"]
    paths:
      - "package-lock.json"
      - "package.json"
jobs:
  vendor:
    runs-on: ubuntu-latest
    if: github.actor == 'renovate[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run vendor
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/osmapp/static/vendor/
          git commit -m "chore: regenerate vendor files" || true
          git push
