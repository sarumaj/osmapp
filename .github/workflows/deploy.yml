name: deploy_to_heroku

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-trigger]

permissions:
  contents: read

jobs:
  test_python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    concurrency:
      group: test-python-${{ matrix.python-version }}-${{ github.event.client_payload.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[test]"

      - name: Test
        run: pytest

  test_javascript:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    concurrency:
      group: test-js-${{ matrix.node-version }}-${{ github.event.client_payload.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test
        run: node --test "tests/js/*.test.mjs"

  build_and_release:
    name: Deploy OSM App to Heroku
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: [test_python, test_javascript]
    permissions:
      contents: write
    concurrency:
      group: deploy-${{ github.event.client_payload.ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Get app url
        uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ""
          heroku_email: ${{ secrets.HEROKU_USER_EMAIL }}
          justlogin: true

      - name: Export app config
        id: export_app_config
        run: |
          HEROKU_APP_URL=$(heroku apps:info --app="${{ secrets.HEROKU_APP_NAME }}" --json | jq -r '.app.web_url | rtrimstr("/")')

          cat <<EOF >> "$GITHUB_OUTPUT"
          HEROKU_APP_URL=$HEROKU_APP_URL
          EOF

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_USER_EMAIL }}
          healthcheck: "${{ steps.export_app_config.outputs.HEROKU_APP_URL }}/service/health"
          rollbackonhealthcheckfailed: true
          usedocker: true
          delay: 30
        env:
          HD_FLASK_DEBUG: "0"
          HD_NOMINATIM_URL: ${{ secrets.NOMINATIM_URL }}
          HD_OVERPASS_URL: ${{ secrets.OVERPASS_URL }}
          HD_OSM_MAX_AREA_KM2: "50"
          HD_OVERPASS_TIMEOUT: "30"
          HD_TILE_URL: ${{ secrets.TILE_URL }}
