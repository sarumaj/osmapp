name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by deploy.yml so the gate and the push check are the same suite —
  # duplicating the steps there would let the two drift apart.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Scoped by workflow as well as ref: when deploy.yml calls this, github.workflow
  # is the caller's name, so a push to main cannot cancel a release's gate.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No install step on purpose: the pure modules run under node:test with
      # Turf loaded from the vendored copy in static/cdn. No build, no lockfile.
      # A bare directory makes node try to require it as a module; the glob
      # also keeps harness.js and the Python files out of the run.
      - name: Run tests
        run: node --test "tests/*.test.js"

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Catches a truncated or malformed browser module, which the test suite
      # would otherwise only reveal for the files it happens to load.
      - name: Check every browser module parses
        run: |
          find src/osmapp/static/js -name '*.js' -print0 \
            | xargs -0 -n1 node --check
