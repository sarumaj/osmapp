name: Build, Test and Deploy OSM App

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: &non_code_paths
      - "**.md"
      - "LICENSE"
      - "img/**"
      - ".vscode/**"
      - ".gitignore"
      - "renovate.json"
  pull_request:
    paths-ignore: *non_code_paths
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Heroku after the tests pass"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [deploy-trigger]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vendor:
    name: Sync vendored assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: vendor-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Check out the ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp the release version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          sed -i -E "s/^version = \".*\"\$/version = \"$version\"/" pyproject.toml
          grep -m1 '^version = ' pyproject.toml

      - name: Regenerate the vendor tree
        run: npm run vendor

      - name: Fold the result back into the ref
        id: push
        if: >-
          github.ref_type == 'tag' ||
          (github.event_name == 'pull_request' && contains(github.actor, 'renovate'))
        run: |
          set -euo pipefail
          git add -A src/osmapp/static/vendor \
            pyproject.toml package.json package-lock.json
          if git diff --cached --quiet; then
            echo "tree already matches the lockfile and the version"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export GIT_AUTHOR_NAME="$(git log -1 --format=%an)"
          export GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            kind="$(git cat-file -t "$GITHUB_REF_NAME")"
            notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
            git commit -m "chore(release): $GITHUB_REF_NAME"
            if [ "$kind" = tag ]; then
              git tag -f -a "$GITHUB_REF_NAME" -m "$notes"
            else
              git tag -f "$GITHUB_REF_NAME"
            fi
            # Pushes made with GITHUB_TOKEN do not start another run, so
            # moving the tag here cannot loop back into this workflow.
            git push --force origin "refs/tags/$GITHUB_REF_NAME"
          else
            git commit --amend --no-edit
            git push --force-with-lease origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          {
            echo "### Vendor — ${{ github.ref_name }}"
            echo "${{ steps.push.outputs.sha && format('At `{0}`.', steps.push.outputs.sha) || 'Not pushed back.' }}"
            find src/osmapp/static/vendor -type f | wc -l | xargs echo "Vendored files:"
          } >> "$GITHUB_STEP_SUMMARY"

  test_python:
    name: Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [vendor]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.vendor.outputs.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[test]"

      - name: Test
        run: pytest -m "not e2e" --junitxml=junit-python.xml

      - name: Report
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit-python.xml
          check_name: Test (Python) results
          detailed_summary: true
          fail_on_failure: false

  test_javascript:
    name: Test (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [vendor]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.vendor.outputs.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=junit-node.xml \
            "tests/js/*.test.mjs"

      - name: Report
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit-node.xml
          check_name: Test (Node) results
          detailed_summary: true
          fail_on_failure: false

  test_e2e:
    name: Test (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [vendor]
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.vendor.outputs.sha || github.sha }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[test]"

      - name: Restore the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Test
        run: pytest -m "e2e" --junitxml=junit-e2e.xml --tracing=retain-on-failure

      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit-e2e.xml
          check_name: Test (E2E) results
          detailed_summary: true
          fail_on_failure: false

  container:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [vendor, test_python, test_javascript, test_e2e]
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    concurrency:
      group: container-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.vendor.outputs.sha || github.sha }}
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref_name == 'main' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=osmapp
            org.opencontainers.image.description=Territory mapping and printable field cards from OpenStreetMap data

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Report
        if: always()
        run: |
          {
            echo "### Container — ${{ github.ref_name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build_and_release:
    name: Deploy OSM App to Heroku
    runs-on: ubuntu-latest
    needs: [vendor, test_python, test_javascript, test_e2e]
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      github.event_name == 'repository_dispatch'
    permissions:
      contents: write
    concurrency:
      group: deploy-${{ github.event.client_payload.ref || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.vendor.outputs.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Get app url
        uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ""
          heroku_email: ${{ secrets.HEROKU_USER_EMAIL }}
          justlogin: true

      - name: Export app config
        id: export_app_config
        run: |
          HEROKU_APP_URL=$(heroku apps:info --app="${{ secrets.HEROKU_APP_NAME }}" --json | jq -r '.app.web_url | rtrimstr("/")')
          cat <<EOF >> "$GITHUB_OUTPUT"
          HEROKU_APP_URL=$HEROKU_APP_URL
          EOF

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_USER_EMAIL }}
          healthcheck: "${{ steps.export_app_config.outputs.HEROKU_APP_URL }}/service/health"
          rollbackonhealthcheckfailed: true
          usedocker: true
          delay: 30
        env:
          HD_FLASK_DEBUG: "0"
          HD_NOMINATIM_URL: ${{ secrets.NOMINATIM_URL }}
          HD_OVERPASS_URL: ${{ secrets.OVERPASS_URL }}
          HD_OSM_MAX_AREA_KM2: "50"
          HD_OVERPASS_TIMEOUT: "30"
          HD_TILE_URL: ${{ secrets.TILE_URL }}

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
