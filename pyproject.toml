[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-app"
version = "0.0.0"
description = "A simple web application for visualizing OpenStreetMap data using Flask and Folium."
requires-python = ">=3.12"
authors = [
    { name="Dawid Ciepiela", email="71898979+sarumaj@users.noreply.github.com" }
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
dependencies = [
    "flask==3.1.3",
    "folium==0.20.0",
    "geopandas==1.1.4",
    "osmnx==2.1.1",
    "pypdf==6.14.2",
    "random-header-generator==1.2",
    "reportlab==5.0.0",
    "shapely==2.1.2",
    "waitress==3.0.2",
]

[project.scripts]
osmapp = "osmapp.__main__:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"osmapp" = [
    "static/**",
    "templates/**",
]
