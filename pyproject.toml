[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osmapp"
version = "1.2.3"
description = "A web application for editing OpenStreetMap data with clustering and session management."
requires-python = ">=3.12"
authors = [
    { name="Dawid Ciepiela", email="71898979+sarumaj@users.noreply.github.com" }
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: JavaScript",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Natural Language :: German",
    "Natural Language :: English",
    "Natural Language :: Polish",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    # Line-separator
    "flask==3.1.3",
    # Line-separator
    "flask-limiter==4.1.1",
    # Line-separator
    "geopandas==1.1.4",
    # Line-separator
    "osmnx==2.1.1",
    # Line-separator
    "random-header-generator==1.2",
    # Line-separator
    "shapely==2.1.2",
    # Line-separator
    "waitress==3.0.2",
]

[project.scripts]
osmapp = "osmapp.__main__:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"osmapp" = [
    "static/**",
    "templates/**",
]

[project.optional-dependencies]
test = [
    # Line-separator
    "playwright==1.62.0",
    # Line-separator
    "pytest==9.1.1",
    # Line-separator
    "pytest-playwright==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
strict_markers = true
markers = [
    "e2e: marks tests that require a browser and a running server",
]
