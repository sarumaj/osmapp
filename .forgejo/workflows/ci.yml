# Converted from .github/workflows/ci.yml for Forgejo by
# scripts/github_to_forgejo.py (HomeLab); --move-ci rewrites it. Jobs needing
# GitHub, macOS, Windows or secrets Forgejo lacks stay in the GitHub file.
name: Build, Test and Deploy OSM App
'on':
  push:
    branches:
    - main
    - renovate/all-patch
    tags:
    - v*
  pull_request: null
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Heroku after the tests pass
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  vendor:
    name: Sync vendored assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vendor-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
    - name: Check out the ref
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        fetch-depth: 0
        lfs: true
    - name: Set up Node
      uses: https://github.com/actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Stamp the release version
      if: github.ref_type == 'tag'
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        npm version "$version" --no-git-tag-version --allow-same-version
        sed -i -E "s/^version = \".*\"\$/version = \"$version\"/" pyproject.toml
        grep -m1 '^version = ' pyproject.toml
    - name: Regenerate the vendor tree and the app bundle
      run: npm run build
    - name: Fold the result back into the ref
      id: push
      if: github.ref_type == 'tag' || (github.event_name == 'pull_request' && contains(github.actor, 'renovate'))
      run: |
        set -euo pipefail
        git add -A src/osmapp/static/vendor src/osmapp/static/version.json \
          pyproject.toml package.json package-lock.json
        if git diff --cached --quiet; then
          echo "tree already matches the lockfile and the version"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        export GIT_AUTHOR_NAME="$(git log -1 --format=%an)"
        export GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae)"
        export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
        export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

        if [ "$GITHUB_REF_TYPE" = tag ]; then
          kind="$(git cat-file -t "$GITHUB_REF_NAME")"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          git commit -m "chore(release): $GITHUB_REF_NAME"
          if [ "$kind" = tag ]; then
            git tag -f -a "$GITHUB_REF_NAME" -m "$notes"
          else
            git tag -f "$GITHUB_REF_NAME"
          fi
          # Pushes made with GITHUB_TOKEN do not start another run, so
          # moving the tag here cannot loop back into this workflow.
          git push --force origin "refs/tags/$GITHUB_REF_NAME"
        else
          git commit --amend --no-edit
          git push --force-with-lease origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
        fi

        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Report
      if: always()
      env:
        SHA: ${{ steps.push.outputs.sha }}
      run: |
        {
          echo "### Vendor — ${{ github.ref_name }}"
          if [ -n "$SHA" ]; then
            echo "At \`$SHA\`."
          else
            echo "Not pushed back."
          fi
          find src/osmapp/static/vendor -type f | wc -l | xargs echo "Vendored files:"
          du -h src/osmapp/static/dist/js/app.min.js | cut -f1 | xargs echo "App bundle:"
        } >> "$GITHUB_STEP_SUMMARY"
  test_python:
    name: Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
    - vendor
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ needs.vendor.outputs.sha || github.sha }}
    - name: Set up Python
      uses: https://github.com/actions/setup-python@v7
      with:
        python-version: 3.15
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install
      run: pip install -e ".[test]"
    - name: Test
      run: pytest -m "not e2e" --junitxml=junit-python.xml
  test_javascript:
    name: Test (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - vendor
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ needs.vendor.outputs.sha || github.sha }}
    - name: Set up Node
      uses: https://github.com/actions/setup-node@v7
      with:
        node-version: 24
    - name: Test
      run: |
        node --test \
          --test-reporter=spec --test-reporter-destination=stdout \
          --test-reporter=junit --test-reporter-destination=junit-node.xml \
          "tests/js/*.test.mjs"
  test_e2e:
    name: Test (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - vendor
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ needs.vendor.outputs.sha || github.sha }}
        lfs: true
    - name: Set up Python
      uses: https://github.com/actions/setup-python@v7
      with:
        python-version: 3.15
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install
      run: pip install -e ".[test]"
    - name: Set up Node
      uses: https://github.com/actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: Build the app bundle
      run: |
        npm ci
        npm run bundle
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: https://github.com/actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    - name: Install Chromium and system dependencies
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: playwright install --with-deps chromium
    - name: Install system dependencies only
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: playwright install-deps chromium
    - name: Test
      run: pytest -m "e2e" --junitxml=junit-e2e.xml --tracing=retain-on-failure
  container:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - vendor
    - test_python
    - test_javascript
    - test_e2e
    if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name
      == 'workflow_dispatch' && inputs.deploy)
    concurrency:
      group: container-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - name: Find Forgejo's registry
      shell: bash
      run: |
        echo "REGISTRY=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_ENV"
        echo "IMAGE_CACHE=${GITHUB_SERVER_URL#*://}/${GITHUB_REPOSITORY,,}:buildcache" >> "$GITHUB_ENV"
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ needs.vendor.outputs.sha || github.sha }}
        lfs: true
    - name: Set up Buildx
      uses: https://github.com/docker/setup-buildx-action@v4
    - name: Log in to GHCR
      uses: https://github.com/docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.PACKAGES_TOKEN }}
    - name: Derive tags and labels
      id: meta
      uses: https://github.com/docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}
        flavor: latest=auto
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=edge,enable=${{ github.ref_name == 'main' }}
          type=sha,format=long,enable=${{ github.ref_name == 'main' }}
        labels: |
          org.opencontainers.image.title=osmapp
          org.opencontainers.image.description=Territory mapping and printable field cards from OpenStreetMap data
    - name: Build and push
      id: build
      uses: https://github.com/docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: type=registry,ref=${{ env.IMAGE_CACHE }}
        cache-to: type=registry,ref=${{ env.IMAGE_CACHE }},mode=max
        provenance: mode=max
        sbom: true
    - name: Report
      if: always()
      run: |
        {
          echo "### Container — ${{ github.ref_name }}"
          echo '```'
          echo "${{ steps.meta.outputs.tags }}"
          echo '```'
          echo "Digest: \`${{ steps.build.outputs.digest }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
  build_and_release:
    name: Deploy OSM App to apps
    runs-on: ubuntu-latest
    needs:
    - vendor
    - test_python
    - test_javascript
    - test_e2e
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.deploy) || github.event_name
      == 'repository_dispatch'
    concurrency:
      group: deploy-${{ github.event.client_payload.ref || github.ref }}
      cancel-in-progress: true
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ needs.vendor.outputs.sha || github.sha }}
        fetch-depth: 0
        lfs: true
    - name: Deploy to apps
      shell: bash
      env:
        APPS_URL: https://apps.ciepiela.org
        APPS_TOKEN: ${{ secrets.APPS_TOKEN }}
        APPS_APP: ${{ github.event.repository.name }}
        APPS_HEALTHCHECK: /service/health
        APPS_DELAY: '30'
        HD_FLASK_DEBUG: '0'
        HD_NOMINATIM_URL: ${{ secrets.NOMINATIM_URL }}
        HD_OVERPASS_URL: ${{ secrets.OVERPASS_URL }}
        HD_OSM_MAX_AREA_KM2: '50'
        HD_OVERPASS_TIMEOUT: '30'
        HD_TILE_URL: ${{ secrets.TILE_URL }}
      run: |
        set -euo pipefail
        api() {
          curl -fsS --retry 3 -H "Authorization: Bearer $APPS_TOKEN" -H "Accept: application/json" "$@"
        }
        uuid=$(api "$APPS_URL/api/v1/applications" \
          | jq -r --arg name "$APPS_APP" '[.[] | select(.name == $name)][0].uuid // empty')
        if [ -z "$uuid" ]; then
          echo "::error::The panel at $APPS_URL has no application named $APPS_APP."
          exit 1
        fi
        # The configuration: HD_NAME becomes NAME; what is empty here keeps its value there.
        vars=$(jq -n '[env | to_entries[] | select(.key | startswith("HD_")) | select(.value != "")
          | {key: .key[3:], value, is_literal: true}]')
        if [ "$vars" != "[]" ]; then
          jq -n --argjson data "$vars" '{data: $data}' | api -X PATCH -H "Content-Type: application/json" \
            -d @- "$APPS_URL/api/v1/applications/$uuid/envs/bulk" > /dev/null
        fi
        # The commit checked out here, also when it is not the branch's newest.
        jq -n --arg sha "$(git rev-parse HEAD 2> /dev/null || echo "$GITHUB_SHA")" '{git_commit_sha: $sha}' \
          | api -X PATCH -H "Content-Type: application/json" -d @- "$APPS_URL/api/v1/applications/$uuid" > /dev/null
        deployment=$(api -X POST "$APPS_URL/api/v1/deploy?uuid=$uuid&force=true" \
          | jq -r '.deployments[0].deployment_uuid')
        echo "Deployment $deployment of $APPS_APP"
        status=queued
        for _ in $(seq 180); do
          status=$(api "$APPS_URL/api/v1/deployments/$deployment" | jq -r .status)
          case "$status" in
            finished) break ;;
            failed | cancelled-by-user)
              echo "::error::The deployment ended as $status; its log is in the panel."
              exit 1
              ;;
          esac
          sleep 10
        done
        if [ "$status" != finished ]; then
          echo "::error::The deployment did not finish within 30 minutes ($status)."
          exit 1
        fi
        if [ -n "${APPS_HEALTHCHECK:-}" ]; then
          address=$(api "$APPS_URL/api/v1/applications/$uuid" | jq -r '(.fqdn // "") | split(",")[0]')
          sleep "${APPS_DELAY:-0}"
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$address$APPS_HEALTHCHECK"
        fi
    - name: Collect the release files
      shell: bash
      run: |
        mkdir -p .forgejo-release
      if: github.ref_type == 'tag'
    - name: Write the release notes
      id: release_notes
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --quiet --unshallow --tags
        else
          git fetch --quiet --tags
        fi
        previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
        {
          echo 'notes<<END_OF_NOTES'
          git log --no-merges --format='- %s' ${previous:+"$previous.."}"$TAG"
          echo END_OF_NOTES
        } >> "$GITHUB_OUTPUT"
      if: github.ref_type == 'tag'
    - name: Publish the release
      uses: https://code.forgejo.org/actions/forgejo-release@v2
      with:
        direction: upload
        url: ${{ github.server_url }}
        repo: ${{ github.repository }}
        tag: ${{ github.ref_name }}
        title: ${{ github.ref_name }}
        release-dir: .forgejo-release
        prerelease: ${{ contains(github.ref_name, '-') }}
        override: false
        release-notes: ${{ steps.release_notes.outputs.notes }}
      if: github.ref_type == 'tag'
